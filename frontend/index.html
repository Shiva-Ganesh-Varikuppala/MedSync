<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedSync</title>
    <script>
      // Apply the saved (or system) theme before the page paints, so there is no light flash.
      try {
        var t = localStorage.getItem("medsync-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#eef0f8" />
    <!-- Tab / address-bar icon: the same Ribbon Mark used in the app. Vite bundles the file and rewrites these paths. -->
    <link rel="icon" type="image/png" href="/src/assets/medsync-ribbon-mark.png" />
    <link rel="apple-touch-icon" href="/src/assets/medsync-ribbon-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
